[project]
name = "huasheng-api"
version = "0.1.0"
description = "花生 (Huasheng) Python SDK — B站官方 AI 视频创作工具的非官方 API 封装"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "huasheng-api contributors" }
]
keywords = ["bilibili", "huasheng", "video", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
extend = "../.shared-config/ruff-base.toml"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "real_external: opt-in tests that create real Huasheng projects and may consume quota",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
